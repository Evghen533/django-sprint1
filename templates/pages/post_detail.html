{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="card shadow-sm">
  <div class="card-body">
    <h1 class="card-title fw-bold">{{ post.title }}</h1>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>

    <p class="text-muted small mb-3">
      <span class="me-2">{{ post.date|date:"Y-m-d" }}</span>
      <span>{{ post.location }}</span>
    </p>

    <div class="card-text">
      {{ post.text|linebreaks }}
    </div>

    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary btn-sm mt-3">Вернуться к списку</a>
  </div>
</article>
{% endblock %}
