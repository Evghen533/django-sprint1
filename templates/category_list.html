{% extends 'base.html' %}

{% block title %}Категория: {{ category_name }}{% endblock %}

{% block content %}
  <div class="container mt-4">
    <a href="{% url 'blog:index' %}" class="text-decoration-none text-secondary">&larr; Назад в ленту</a>

    <div class="card shadow-sm mt-3">
      <div class="card-body text-center py-5">
        <h2 class="card-title text-primary">Категория «{{ category_name }}»</h2>
        <p class="lead text-muted">
          Здесь скоро появятся все посты по теме «{{ category_name }}».<br>
          А пока — посмотрите нашу главную ленту!
        </p>
        <a href="{% url 'blog:index' %}" class="btn btn-outline-primary">Вернуться к ленте</a>
      </div>
    </div>
  </div>
{% endblock %}
