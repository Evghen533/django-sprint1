{% extends "base.html" %}
{% load static %}

{% block title %}{{ post.title }} — Блогикум{% endblock %}

{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p><strong>Дата:</strong> {{ post.date }}</p>
  <p><strong>Место:</strong> {{ post.location }}</p>
  <p><strong>Категория:</strong> {{ post.category }}</p>
  <hr>
  <div>{{ post.text|linebreaks }}</div>
  <a href="{% url 'blog:index' %}">← Назад к списку</a>
</article>
{% endblock %}
