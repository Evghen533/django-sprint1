{% extends 'base.html' %}

{% block title %}
  {{ post.title }} — Blogicum
{% endblock %}

{% block content %}
  <article class="card p-4 shadow-sm">
    <h1 class="card-title h2 mb-3">{{ post.title }}</h1>

    <div class="mb-4 text-muted small">
      <span class="me-3">📍 {{ post.place }}</span>
      <span>📅 {{ post.date }}</span>
      <span class="ms-3">
        Категория:
        <a href="{% url 'blog:category_posts' post.category_slug %}" class="badge bg-secondary text-decoration-none">
          {{ post.category_name }}
        </a>
      </span>
    </div>

    <hr class="my-4">

    <div class="card-text">
      {{ post.full_text }}
    </div>

    <div class="mt-4 pt-3 border-top">
      <a href="{% url 'blog:index' %}" class="btn btn-outline-secondary">← Назад к ленте</a>
    </div>
  </article>
{% endblock %}
