<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ИСПРАВЛЕНИЕ ЗДЕСЬ: тег <title> снаружи, блок только для контента -->
    <title>{% block title %}Дневник Робинзона Крузо{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body>
    <header>
        <!-- Логотип слева -->
        <a href="{% url 'blog:index' %}" class="logo">Дневник Робинзона</a>

        <!-- Меню справа -->
        <nav>
            <ul>
                <!-- Класс active нужен, чтобы кнопка была синей на главной странице -->
                <li><a href="{% url 'blog:index' %}" class="active">Лента записей</a></li>
                <li><a href="{% url 'pages:about' %}">О проекте</a></li>
                <li><a href="{% url 'pages:rules' %}">Наши правила</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Дневник Робинзона Крузо. Все права защищены.</p>
    </footer>
</body>
</html>
