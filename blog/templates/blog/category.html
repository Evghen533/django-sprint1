{% extends 'blog/base.html' %}

{% block title %}Категория: {{ category_slug }} — Блогикум{% endblock %}

{% block content %}
    <h1>Публикации в категории «{{ category_slug }}»</h1>

    {% for post in posts %}
        <article class="post">
            <h2>{{ post.location }}</h2>
            <p>{{ post.date }}</p>
            <div>{{ post.text|linebreaks }}</div>
        </article>
    {% endfor %}
{% endblock %}
