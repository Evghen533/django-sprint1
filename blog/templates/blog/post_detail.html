{% extends "base.html" %}
{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="card shadow-sm">
  <div class="card-body">
    <h1 class="card-title fw-bold">{{ post.title }}</h1>

    <p class="text-muted small mb-3">
      <span class="me-2">{{ post.created_at|date:"Y-m-d" }}</span>
    </p>

    <div class="card-text">
      {{ post.content|linebreaks }}
    </div>

    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary btn-sm mt-3">Вернуться к списку</a>
  </div>
</article>
{% endblock %}
