{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="card shadow-sm">
  <div class="card-body">
    <h1 class="card-title fw-bold">{{ post.title }}</h1>
    <p>{{ post.content|linebreaks }}</p>

    {% if post.created_at %}
      <p class="text-muted small mb-3">
        <span class="me-2">{{ post.created_at|date:"d.m.Y H:i" }}</span>
      </p>
    {% endif %}

    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary btn-sm mt-3">Вернуться к списку</a>
  </div>
</article>
{% endblock %}
