{% extends "base.html" %}

{% block title %}Лента записей — Блогикум{% endblock %}

{% block content %}
  <h1>Лента записей</h1>
  {% for post in posts %}
    <article>
      {% include "includes/post_card.html" %}

      <p>{{ post.text|truncatewords:20 }}</p>
      <a href="{% url 'blog:post_detail' post.id %}" class="read-more">Читать полный текст</a>
    </article>
    <hr>
  {% endfor %}
{% endblock %}
