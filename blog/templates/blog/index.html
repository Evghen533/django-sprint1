{% extends "base.html" %}

{% block title %}Лента записей — Блогикум{% endblock %}

{% block content %}
  <h1>Лента записей</h1>
  {% for post in posts %}
    <article>
      {% include "post_card.html" %}

      <p>
        {{ post.text|truncatewords:20 }}
        <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>
      </p>
    </article>
    <hr>
  {% endfor %}
{% endblock %}
