{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента записей — Блогикум</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'blog:index' %}" class="logo">Блогикум</a>
        <nav>
            <a href="{% url 'blog:index' %}">Лента записей</a>
            <a href="{% url 'pages:about' %}">О проекте</a>
            <a href="{% url 'pages:rules' %}">Наши правила</a>
        </nav>
    </header>

    <main>
        <h1>Лента записей</h1>
        {% for post in posts %}
            <article>
                <ul>
                    <li>Место: {{ post.location }}</li>
                    <li>Дата: {{ post.date }}</li>
                    <li>Категория: {{ post.category }}</li>
                </ul>
                <p>{{ post.text|truncatewords:20 }}</p>
                <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>
            </article>
            <hr>
        {% endfor %}
        </main>

    <footer>
        &copy; Блогикум
    </footer>
</body>
</html>
