{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Лента записей</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'blog:index' %}">Лента записей</a>
            <a href="{% url 'pages:about' %}">О проекте</a>
            <a href="{% url 'pages:rules' %}">Наши правила</a>
        </nav>
    </header>
    <main>
        <h1>Лента записей</h1>
        {% for post in posts %}
        <article>
            <ul>
                <li>Место: {{ post.location }}</li>
                <li>Дата: {{ post.date }}</li>
                <li>Категория: <a href="{% url 'blog:category_posts' post.category %}">{{ post.category }}</a></li>
            </ul>
            <p>{{ post.text }}</p>
            <a href="{% url 'blog:post_detail' post.id %}">{{ post.title }}</a>
        </article>
        {% endfor %}
    </main>
</body>
</html>
