{% extends "base.html" %}

{% block title %}{{ post.location }} — Блогикум{% endblock %}

{% block content %}

    {% include "post_card.html" %}

    <p>{{ post.text }}</p>

    <hr>
    <a href="{% url 'blog:index' %}" class="back-link">← Назад к ленте</a>
  </article>
{% endblock %}
