{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>{{ post.location }} — Блогикум</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    <header>
      <a href="{% url 'blog:index' %}" class="logo">Блогикум</a>
      <nav>
        <a href="{% url 'blog:index' %}">Лента записей</a>
        <a href="{% url 'pages:about' %}">О проекте</a>
        <a href="{% url 'pages:rules' %}">Наши правила</a>
      </nav>
    </header>

    <main>
      <article>
        <h1>{{ post.location }}</h1>
        <p><strong>Дата:</strong> {{ post.date }}</p>
        <p><strong>Категория:</strong> {{ post.category }}</p>
        <hr>
        <p>{{ post.text }}</p>
        <a href="{% url 'blog:index' %}" class="back-link">← Назад к ленте</a>
      </article>
    </main>

    <footer>
      &copy; Блогикум
    </footer>
  </body>
</html>
