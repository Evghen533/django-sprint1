{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.location }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'blog:index' %}">Лента записей</a>
            <a href="{% url 'pages:about' %}">О проекте</a>
            <a href="{% url 'pages:rules' %}">Наши правила</a>
        </nav>
    </header>
    <main>
        <!-- Используем location вместо title -->
        <h1>{{ post.location }}</h1>

        <!-- Блок с картинкой можно оставить, но он не сработает с текущим списком posts.
             Если картинок нет, лучше удалить этот блок, чтобы не было пустых мест -->
        {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.location }}">
        {% endif %}

        <p><strong>Место:</strong> {{ post.location }}</p>
        <p><strong>Дата:</strong> {{ post.date }}</p>
        <!-- Просто выводим значение category, так как это строка -->
        <p><strong>Категория:</strong> {{ post.category }}</p>
        <hr>
        <!-- Используем post.text вместо post.content -->
        <p>{{ post.text|linebreaks }}</p>

        <a href="{% url 'blog:index' %}">Вернуться к ленте</a>
    </main>
</body>
</html>
