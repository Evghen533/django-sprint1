{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <!-- ВАЖНО: Этот div с классом logo нужен для стиля .logo в CSS -->
        <div class="logo">Дневник Робинзона</div>

        <!-- ВАЖНО: nav > ul > li > a — именно под эту структуру написаны твои стили -->
        <nav>
            <ul>
                <li><a href="{% url 'blog:index' %}">Лента записей</a></li>
                <li><a href="{% url 'pages:about' %}">О проекте</a></li>
                <li><a href="{% url 'pages:rules' %}">Наши правила</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2024 Дневник Робинзона Крузо. Все права защищены.
    </footer>
</body>
</html>
